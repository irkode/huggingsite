# Huggingsite default theme config
title = "HuggingSite"

[params]
   description = "A quite bare personal Hugo Theme"
   title       = "Oops no page title set"

[markup]
   [markup.highlight]
      noClasses = false
      style     = "monokai"

[frontmatter]
   date    = ["date"]
   lastmod = [":git", "lastmod"]

[[cascade]]
   [cascade.build]
      list             = "local"
      publishResources = false
      render           = "never"

   [cascade.target]
      path = "{/error-404,/error-404/**}"

[imaging]
   [imaging.webp]
      compression = "lossless"
      hint        = "drawing"
      method      = 6
      quality     = 100
      useSharpYuv = true

[module]
   [module.hugoVersion]
      min = "0.169.0"
