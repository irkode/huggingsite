# Hugginface default theme config
title = "HuggingSite"

[params]
   description = "An opinionated -- quite bare Hugo theme"
   title       = "Oops no title set"
   [params.huggingsite]
      # maybe a map here if we need more browser storage stuff
      storageKey = "huggingsite-theme"

      [params.huggingsite.images]
         [params.huggingsite.images.error]
            image   = "img/error.png"
            overlay = "img/error-overlay.png"
            size    = 192
         [params.huggingsite.images.site]
            image   = "img/site.png"
            overlay = "img/site-overlay.png"
            size    = 192
         [params.huggingsite.images.siteIcon]
            image   = "img/site-icon.png"
            overlay = "img/site-icon-overlay.png"
            size    = 48
         [params.huggingsite.images.favicon]
            image   = "img/favicon.png"
            overlay = "img/favicon-overlay.png"
            size    = 192

      [params.huggingsite.urls]
         repo = "https://github.com/irkode/huggingsite"

      [params.huggingsite.markup]
         enableHighlightJS = true
         chromaStyle       = "monokai"
         # language fallback settings
         #  language        a language chroma can render
         #  hljs            autodetect with highlightjs
         # hljs-pass-language   pass language to highlightjs
         #fallbackEmpty   = "hljs"
         #fallbackUnknown = "hljs-hugo-html"

[module]
   [module.hugoVersion]
      extended = false
      min      = '0.166.0'
      max      = '0.166.0'
