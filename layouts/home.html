{{- define "main" }}
<div class="headline banner">
	<div>
		{{- with partialCached "img/overlay.html" (dict "type" "site" "size" 128) "site" 128 }}
			<img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="" />
		{{- end }}
	</div>
	<div class="headline-text">
		<h1>{{ or .Description site.Params.Description }}</h1>
	</div>
</div>

{{- .Content }}
{{- end }}
{{- /**/ -}}
