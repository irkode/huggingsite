{{- define "main" }}
<div class="headline banner">
	<div>
		{{- with partialCached "img/overlay.html" (dict "type" "site" "size" 84) "site" 84 }}
			<img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="" />
		{{- end }}
	</div>
	<div class="headline-text">
		<h1>{{- .Title }}</h1>
	</div>
</div>
{{- .Content }}
{{- end }}
